spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urlshortener}
    username: ${DB_USER:urlshortener}
    password: ${DB_PASSWORD:urlshortener}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: analytics-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.urlshortener.domain.event
      auto-offset-reset: earliest

server:
  port: 8080

# URL-601: default level is INFO — hot-path DEBUG logs (redirect resolution, duplicate-event
# skips) are intentionally silent by default so they don't flood output at the ADR-10 design
# target (1,000 RPS redirect). Override locally for troubleshooting, e.g.:
#   logging.level.com.example.urlshortener=DEBUG
logging:
  level:
    root: INFO
    com.example.urlshortener: INFO

urlshortener:
  base-url: ${SHORT_BASE_URL:http://localhost:8080}
  cache:
    ttl-seconds: 86400
  rate-limit:
    create-per-minute: 100
    redirect-per-minute: 1000
  alias:
    reserved-words: api,admin,urls,actuator,swagger-ui,v3,health,static,assets,www
  retention:
    daily-rollup-days: 730

kafka:
  topics:
    click-events: click-events

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
